name: Release packages

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debian:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        shell: bash
        run: |
          version=$(<VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == "v$version" ]]
          fi
          epoch=$(git show -s --format=%ct)
          printf 'version=%s\nepoch=%s\n' "$version" "$epoch" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper python3
      - name: Build Debian package and source archive
        run: make pkg-deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-source
          path: |
            dist/dell-rf-*.tar.gz
            dist/aur/PKGBUILD
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-debian
          path: dist/dell-rf_*.deb
          if-no-files-found: error

  arch:
    needs: debian
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      SOURCE_DATE_EPOCH: ${{ needs.debian.outputs.epoch }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source
          path: dist
      - name: Build Arch package and AUR files
        run: |
          useradd --create-home builder
          install -d -o builder -g builder /build/dell-rf
          cp -a . /build/dell-rf/
          chown -R builder:builder /build/dell-rf
          runuser -u builder -- bash -c 'cd /build/dell-rf && bash packaging/build-arch.sh'
          cp /build/dell-rf/dist/*.pkg.tar.zst /build/dell-rf/dist/*-aur.tar.gz dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-arch
          path: |
            dist/*.pkg.tar.zst
            dist/*-aur.tar.gz
          if-no-files-found: error

  draft:
    if: github.event_name == 'push'
    needs: [debian, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create draft release
        shell: bash
        run: |
          cd dist
          assets=(dell-rf-*.tar.gz dell-rf-*.pkg.tar.zst dell-rf_*.deb)
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS \
            --verify-tag --draft --title "dell-rf ${RELEASE_TAG#v}" \
            --notes 'Linux packages for x86_64/amd64. Debian 12+ and Ubuntu 22.04+. See the README for tested hardware and usage.'
